/* ---------- launches ---------- */
function buildLaunches(d){
  const list = d.launches_list;
  list.forEach(r => { r.when = launchWhen(r); });
  const months = [...new Set(list.map(r => r.when))].sort();
  // calendar months from the earliest launch to the latest, both counted
  const ym = w => Number(w.slice(0, 4)) * 12 + Number(w.slice(5, 7));
  const dated = months.filter(Boolean);
  const span = dated.length ? ym(dated[dated.length - 1]) - ym(dated[0]) + 1 : 0;
  const formats = [...new Set(list.map(r => r.format))].sort();
  // the reader runs a handful of shops, so independents are the default view
  let who = "independent", month = "all", type = "all", expanded = false;
  const LIMIT = 20;

  document.getElementById("launch-sub").textContent =
    `${list.length} new items with prices, from the last ${span} ${span === 1 ? "month" : "months"}. ` +
    `Big chains are hidden at first, because they price differently from a small cafe. ` +
    `We leave out mooncakes and National Day items, because cafes sell those for the date and not because customers ask. ` +
    `We also leave out hotel restaurants.`;

  // Hotel F&B is already dropped upstream, so All = Independents + Chains.
  // The chart reads from this too.
  const byWho = () => list.filter(r =>
    who === "all" || (who === "chain" ? r.is_chain : !r.is_chain));

  function chips(container, opts, get, set, onPick){
    const box = document.getElementById(container);
    opts.forEach(([val, label]) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "choice"; b.textContent = label; b.dataset.val = val;
      b.setAttribute("aria-pressed", String(get() === val));
      b.addEventListener("click", () => {
        set(val); expanded = false;
        box.querySelectorAll(".choice").forEach(x =>
          x.setAttribute("aria-pressed", String(x.dataset.val === val)));
        if(onPick) onPick();
        repaint();
        track("tab_changed", {section:"launches", filter:container, value:val});
      });
      box.appendChild(b);
    });
  }

  chips("who-filter", [["all","All"], ["independent","Small shops and small groups"], ["chain","Big chains"]],
        () => who, v => who = v, () => drawLaunchChart(d, byWho()));
  chips("month-filter", [["all","All"], ...months.map(m => [m, whenLabel(m)])],
        () => month, v => month = v);
  chips("type-filter", [["all","All"], ...formats.map(f => [f, f.charAt(0).toUpperCase() + f.slice(1)])],
        () => type, v => type = v);

  function matching(){
    return byWho().filter(r => (month === "all" || r.when === month)
                            && (type === "all" || r.format === type));
  }

  const paint = makeSortable("launch-table",
    () => { const m = matching(); return expanded ? m.slice() : m.slice(0, LIMIT); },
    r => `<tr>
      <td class="item">${esc(r.item_name)}</td>
      <td>${esc(r.shop)}</td>
      <td class="soft">${esc(r.flavour)}</td>
      <td class="n mid">${r.price == null ? "&mdash;" : money(r.price)}</td>
      <td class="soft num">${esc(whenLabel(r.when))}</td>
    </tr>`,
    {key:"when", dir:"desc"});

  const moreBtn = document.getElementById("launch-more");
  const countEl = document.getElementById("launch-count");
  function repaint(){
    const total = matching().length;
    moreBtn.hidden = total <= LIMIT;
    moreBtn.textContent = expanded ? "Show less" : "Show more";
    countEl.textContent = total === 0
      ? "No new items match."
      : `Showing ${expanded ? total : Math.min(LIMIT, total)} of ${total}`;
    paint();
  }
  moreBtn.addEventListener("click", () => { expanded = !expanded; repaint(); });

  redrawLaunchChart = () => drawLaunchChart(d, byWho());
  drawLaunchChart(d, byWho());
  repaint();
}

let redrawLaunchChart = () => {};

/* When a new item appeared. Most carry the month the shop put it on sale.
   Where the shop gave none, the day we first saw it stands in, so the item
   still has a place in the chart, the filter and the sort: "2026-09-00" for
   a month, "2026-10-04" for a first-seen day. Both are the same length so
   they sort as text. */
const launchWhen = r => r.launch_month ? r.launch_month + "-00" : (r.first_seen || "");
function whenLabel(when){
  if(/-00$/.test(when)) return monthLabel(when);
  return when ? "First seen " + dayMonth(when) : "No date";
}

const MIN_SEGMENTS = 3;   // below this a month is stated as a number, not drawn
function drawLaunchChart(d, rows){
  // counts come from the rows actually in scope, so the chart tracks the Who filter
  const order = d.format_split.map(f => f.format);
  const months = [...new Set(d.launches_list.map(launchWhen))].sort();
  const countOf = (m, f) => rows.filter(r => launchWhen(r) === m && r.format === f).length;
  const totals = months.map(m => rows.filter(r => launchWhen(r) === m).length);
  const maxTotal = Math.max(...totals, 1);

  const el = document.getElementById("launch-svg");
  const W = boxWidth(el.parentElement, 900);
  const narrow = W < 620;
  const TOP = 12, BOT = narrow ? 46 + order.length * 14 : 46;
  const H = (narrow ? 210 : 280) + (narrow ? order.length * 14 : 0);
  const plotH = H - TOP - BOT;
  const sideLabel = !narrow;
  const slot = W / months.length;
  const colW = Math.min(narrow ? 66 : 120, slot * (sideLabel ? 0.34 : 0.46));
  const ops = [0.85, 0.62, 0.42, 0.24, 0.14];

  let svg = "";
  months.forEach((m, mi) => {
    const cx = slot * mi + slot/2;
    const x = sideLabel ? cx - colW * 0.85 : cx - colW/2;
    const total = totals[mi];

    if(total < MIN_SEGMENTS){
      // too few to draw legibly, so say the number instead of drawing slivers
      svg += `<text x="${cx.toFixed(2)}" y="${(TOP + plotH - 6).toFixed(2)}" text-anchor="middle" fill="var(--ink)" font-family="Archivo,sans-serif" font-size="21" style="font-variant-numeric:tabular-nums">${total}</text>`;
    } else {
      let y = TOP + plotH;
      let lastLabelY = Infinity;
      order.forEach((f, fi) => {
        const c = countOf(m, f);
        if(!c) return;
        const h = (c / maxTotal) * plotH;
        y -= h;
        svg += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${colW.toFixed(2)}" height="${h.toFixed(2)}" fill="var(--brand)" opacity="${ops[fi % ops.length]}"></rect>`;
        if(h >= 16){
          svg += `<text x="${(x + colW/2).toFixed(2)}" y="${(y + h/2 + 5).toFixed(2)}" text-anchor="middle" fill="#fff" font-family="Archivo,sans-serif" font-size="13" font-weight="600" style="font-variant-numeric:tabular-nums">${c}</text>`;
        }
        if(sideLabel){
          let ly = y + h/2 + 4;
          if(lastLabelY - ly < 14) ly = lastLabelY - 14;
          lastLabelY = ly;
          svg += `<text x="${(x + colW + 9).toFixed(2)}" y="${ly.toFixed(2)}" fill="var(--muted)" font-family="Archivo,sans-serif" font-size="12">${esc(f)} ${c}</text>`;
        }
      });
    }

    svg += `<text x="${cx.toFixed(2)}" y="${TOP + plotH + 22}" text-anchor="middle" fill="var(--ink)" font-family="Archivo,sans-serif" font-size="${narrow ? 12 : 14}">${esc(whenLabel(m))}</text>`;
    svg += `<text x="${cx.toFixed(2)}" y="${TOP + plotH + 39}" text-anchor="middle" fill="var(--muted)" font-family="Archivo,sans-serif" font-size="12" style="font-variant-numeric:tabular-nums">${total} ${total === 1 ? "new item" : "new items"}</text>`;
    if(narrow && total >= MIN_SEGMENTS){
      order.forEach((f, fi) => {
        const c = countOf(m, f);
        if(!c) return;
        svg += `<text x="${cx.toFixed(2)}" y="${TOP + plotH + 57 + fi * 14}" text-anchor="middle" fill="var(--muted)" font-family="Archivo,sans-serif" font-size="11" style="font-variant-numeric:tabular-nums">${esc(f)} ${c}</text>`;
      });
    }
  });

  el.setAttribute("viewBox", `0 0 ${W} ${H}`);
  el.setAttribute("preserveAspectRatio", "xMinYMin meet");
  el.style.height = H + "px";
  el.innerHTML = svg;
  document.getElementById("launch-desc").textContent =
    "New items each month, by type: " + months.map((m,i) => `${whenLabel(m)} ${totals[i]}`).join(", ") + ".";
}

/* ---------- promos ---------- */
function buildPromos(d){
  /* Only offers still running show. An offer ends at the close of its end
     date, so it stays through that day and goes the day after. Today is the
     reader's own date, read when the page loads, so the list stays right
     between rebuilds. An offer with no end date stays, and says so. Hotel F&B
     is already removed upstream. */
  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  const live = d.promos_list
    .filter(r => !r.end_date || r.end_date >= today)
    .map(r => Object.assign({}, r, {end_date: r.end_date || null}));   // no date sorts last
  const bundles = live.filter(r => r.promo_type === "bundle").length;
  document.getElementById("promo-sub").textContent =
    `${live.length} ${live.length === 1 ? "offer is" : "offers are"} running now. ` +
    `${bundles} of them ${bundles === 1 ? "is a bundle, not a price cut" : "are bundles, not price cuts"}. ` +
    `A bundle sells more and keeps the menu price the same.`;

  const types = [...new Set(live.map(r => r.promo_type))].sort();
  const LABELS = {bundle:"Bundles", price_cut:"Price cuts"};
  let current = "all", expanded = false;
  const LIMIT = 12;

  const tabs = document.getElementById("promo-tabs");
  const add = (val, label) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "choice"; b.textContent = label; b.dataset.val = val;
    b.setAttribute("aria-pressed", String(val === current));
    b.addEventListener("click", () => {
      current = val; expanded = false;
      tabs.querySelectorAll(".choice").forEach(x =>
        x.setAttribute("aria-pressed", String(x.dataset.val === val)));
      repaint();
      track("tab_changed", {section:"promos", value:val});
    });
    tabs.appendChild(b);
  };
  add("all", "All");
  types.forEach(t => add(t, LABELS[t] || t));

  function matching(){
    return live.filter(r => current === "all" || r.promo_type === current);
  }

  const paint = makeSortable("promo-table",
    () => { const m = matching(); return expanded ? m.slice() : m.slice(0, LIMIT); },
    r => `<tr>
      <td class="item">${esc(r.brand_name)}</td>
      <td>${esc(r.offer_text)}</td>
      <td class="soft">${esc((LABELS[r.promo_type] || r.promo_type).replace(/s$/,""))}</td>
      <td class="soft num">${r.end_date ? esc(r.end_date) : "No end date given"}</td>
    </tr>`,
    {key:"end_date", dir:"asc"});

  const moreBtn = document.getElementById("promo-more");
  const countEl = document.getElementById("promo-count");
  function repaint(){
    const total = matching().length;
    moreBtn.hidden = total <= LIMIT;
    moreBtn.textContent = expanded ? "Show less" : "Show more";
    countEl.textContent = `Showing ${expanded ? total : Math.min(LIMIT, total)} of ${total}`;
    paint();
  }
  moreBtn.addEventListener("click", () => { expanded = !expanded; repaint(); });
  repaint();
}

/* ---------- footer ---------- */
// every recorded date behind a price on the page: the table rows carry their
// earliest and latest, the named prices carry their own
function allRecordedDates(d){
  const dates = [];
  d.price_table.forEach(r => dates.push(r.observed_from, r.observed_to));
  Object.keys(d.named_prices).forEach(k => d.named_prices[k].forEach(r => dates.push(r.observed_date)));
  return dates;
}
function buildFooter(d){
  document.getElementById("colophon-left").textContent =
    `${d.meta.shops_with_prices} cafes and bakeries, ${d.meta.districts_count} areas, prices checked ${checkedWhen(allRecordedDates(d))}`;
}

/* ---------- forms ---------- */
const SIGNUP_DONE = {
  newsletter_hero:    "You are on the list. Your first email comes this week.",
  waitlist:           "You are on the waitlist. We will email you before we start."
};
const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

function bindSignup(formId, inputId, noteId, source, evt){
  const form = document.getElementById(formId);
  const input = document.getElementById(inputId);
  const note = document.getElementById(noteId);
  const btn = form.querySelector("button[type=submit]");
  const btnLabel = btn.textContent;

  form.addEventListener("submit", async e => {
    e.preventDefault();
    note.hidden = true;
    const email = input.value.trim();

    if(!isEmail(email)){
      // nothing is sent until the address is plausible
      note.className = "formnote bad";
      note.textContent = "Please check your email address";
      note.hidden = false;
      input.focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = "Sending";

    try{
      const res = await fetch(SUPABASE_URL + "/rest/v1/signups", {
        method: "POST",
        headers: SB_HEADERS,
        body: JSON.stringify({email: email, source: source})
      });
      if(!res.ok) throw new Error("HTTP " + res.status);

      // the form goes away so the confirmation is the only thing left to read
      const done = document.createElement("p");
      done.className = "formdone";
      done.textContent = SIGNUP_DONE[source];
      form.replaceWith(done);
      note.hidden = true;
      track(evt, {position: source});
    }catch(err){
      // whatever they typed stays in the field
      btn.disabled = false;
      btn.textContent = btnLabel;
      note.className = "formnote bad";
      note.textContent = "We could not save that. Please try again, or email us at arshin.sikka@u.nus.edu";
      note.hidden = false;
    }
  });
}

function wireForms(){
  bindSignup("news-form", "news-email", "news-note", "newsletter_hero", "newsletter_submitted");
  bindSignup("wait-form", "wait-email", "wait-note", "waitlist", "waitlist_submitted");
}
