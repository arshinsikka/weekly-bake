<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Weekly Bake</title>
<meta name="description" content="Prices and new menu items at Singapore cafes and bakeries.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FFFFFF'/%3E%3Cpath d='M5 7l5 18 6-12 6 12 5-18' fill='none' stroke='%231B5E4A' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://www.onemap.gov.sg" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
:root{
  --paper:#FFFFFF;
  --ink:#1C2420;
  --body:#3D453F;
  --muted:#6E7570;
  --rule:#E2E4E0;
  --brand:#1B5E4A;
  --high:#A03D22;
  --high-tint:#CB9485;   /* --high at 55% on --paper */

  --f-display:"Fraunces",Georgia,serif;
  --f-text:"Archivo",system-ui,-apple-system,sans-serif;

  --s13:13px; --s15:15px; --s17:17px; --s21:21px;
  --s26:26px; --s33:33px; --s42:42px; --s54:54px;

  --gap-section:72px;
  --maxw:1080px;
  --pad:28px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--body);
  font-family:var(--f-text); font-size:var(--s17); line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--f-display); color:var(--ink); font-weight:500; margin:0; line-height:1.15}
p{margin:0}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 var(--pad)}
.num{font-variant-numeric:tabular-nums}
.measure{max-width:68ch}

a{color:var(--brand); text-decoration:underline; text-underline-offset:2px}
:focus-visible{outline:2px solid var(--brand); outline-offset:3px; border-radius:2px}

/* an author display rule must never show something marked hidden. until-found
   is left alone: it hides with content-visibility and needs its box. */
[hidden]:not([hidden=until-found]){display:none !important}
button{font-family:inherit; font-size:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer}

/* ---------- masthead ---------- */
.masthead{padding:22px 0 18px; border-bottom:1px solid var(--rule)}
.masthead .wrap{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap}
.wordmark{font-family:var(--f-display); font-weight:600; font-size:var(--s21); color:var(--ink); letter-spacing:-.01em}
.masthead .tag{font-size:14px; color:var(--muted)}

/* ---------- hero ---------- */
.hero{padding:28px 0 var(--gap-section)}
.hero h1{font-size:clamp(26px,2.7vw,34px); line-height:1.15; letter-spacing:-.015em}
.hero .lede{font-size:var(--s15)}
/* desktop: copy across the top, map on the left, finder panel down the right.
   The last row takes up the slack, so a tall map never stretches the panel. */
.hero-layout{
  display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); column-gap:40px;
  grid-template-rows:auto auto auto 1fr;
  grid-template-areas:"head head" "lede lede" "map find" "map sign";
}
.hero h1{grid-area:head}
.hero .lede{grid-area:lede; margin:10px 0 22px}
.mapcol{grid-area:map; min-width:0}
.finder{grid-area:find; min-width:0; border-top:2px solid var(--ink); padding-top:16px}
.herosignup{grid-area:sign; min-width:0}

/* the item picker drives the map, so it sits on its top edge with the view toggle */
.mapbar{display:flex; align-items:center; justify-content:space-between; gap:10px 24px; margin:0 0 12px; padding-top:16px}
.mapbar .choices{margin:0}
.itempick{display:flex; align-items:center; gap:10px; min-width:0}
.itempick label{font-size:var(--s15); color:var(--muted); white-space:nowrap}
.itempick select{font-weight:500; min-width:0}
.viewbar{flex:0 0 auto; flex-wrap:nowrap}
/* phones swap the two view tabs for one small button in the map's corner */
.viewwrap{position:relative}
.viewswitch{
  display:none; position:absolute; top:10px; right:0; z-index:6;
  font-size:var(--s13); font-weight:500; color:var(--ink);
  background:var(--paper); border:1px solid var(--rule); border-radius:3px; padding:7px 12px;
}
.viewwrap.listmode .viewswitch{position:static; margin:0 0 12px auto}
.herosignup{margin-top:24px; padding-top:20px; border-top:1px solid var(--rule)}
.herosignup .signup{margin-top:0}
/* the panel is narrow, so the field gives way before the button wraps. Desktop
   only: in the phone's column layout a flex-basis would become a height. */
@media (min-width:861px){ .herosignup .signup input[type=email]{flex:1 1 150px} }

/* ---------- map ---------- */
.mapframe{position:relative}
.map{
  height:clamp(340px, calc(100vh - 320px), 540px);
  background:#F4F5F3; border:1px solid var(--rule);
  position:relative; z-index:0; isolation:isolate;
}
/* one finger belongs to the page. Leaflet would otherwise claim every touch. */
/* at half zoom steps scaled tiles meet on half pixels and a hairline of
   background shows through. Blending the tiles additively inside their own
   layer makes the two half-covered edges add up to a whole one. */
.map .leaflet-layer{isolation:isolate}
.map .leaflet-tile{mix-blend-mode:plus-lighter}
.map.leaflet-container{touch-action:pan-x pan-y !important; font-family:var(--f-text); font-size:var(--s13)}
.maphint{
  position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
  padding:20px; text-align:center; pointer-events:none;
  background:rgba(28,36,32,.55); color:#fff; font-size:var(--s17); font-weight:500;
  opacity:0; transition:opacity .2s linear;
}
.maphint.on{opacity:1}
@media (prefers-reduced-motion:reduce){ .maphint{transition:none} }
.mapcaption{margin-top:12px; font-size:var(--s15); color:var(--body)}
.mapadd{margin-top:8px; font-size:var(--s15)}
.mapnote{font-size:var(--s13); color:var(--muted); margin-top:8px}

.pinwrap{background:none; border:none; overflow:visible}
.pinwrap:focus{outline:none}
.pin{position:absolute; left:0; top:0; --off:0}
.pin-dot{
  position:absolute; width:11px; height:11px; border-radius:50%;
  background:var(--ink); border:1.5px solid var(--paper);
  transform:translate(calc(-50% + var(--off) * 11px), -50%);
}
/* a dot is too small to tap, so it carries a larger invisible target */
.pin-dot::after{content:""; position:absolute; inset:-9px}
.pin-label{
  display:none; position:absolute; white-space:nowrap;
  font:500 13px/1 var(--f-text); font-variant-numeric:tabular-nums;
  padding:5px 7px; border-radius:3px;
  color:var(--ink); background:var(--paper); border:1px solid var(--rule);
  transform:translate(-50%, calc(-50% + var(--off) * 26px));
}
.map.labels .pin-dot{display:none}
.map.labels .pin-label{display:block}
/* price against the item's usual price. Each step differs in lightness or
   shape as well as hue, so it still reads without colour vision: a ring, a
   dark dot, a light dot, a larger dark dot. */
.pin.lo .pin-dot{background:var(--paper); border:2.5px solid var(--brand)}
.pin.lo .pin-label{color:var(--brand); border-color:var(--brand)}
.pin.up .pin-dot{background:var(--high-tint)}
.pin.up .pin-label{color:var(--high)}
.pin.hi .pin-dot{background:var(--high); width:14px; height:14px}
.pin.hi .pin-label{background:var(--high); border-color:var(--high); color:var(--paper)}
/* the reader's own shop: larger, solid, with a dark ring no other pin has */
.pin.me .pin-dot{background:var(--brand); width:17px; height:17px; border:2px solid var(--paper); box-shadow:0 0 0 2px var(--ink)}
.pin.me .pin-label{background:var(--brand); border-color:var(--brand); color:var(--paper); box-shadow:0 0 0 2px var(--ink)}

.legend{display:flex; flex-wrap:wrap; gap:4px 14px; margin:10px 0 0; padding:0; list-style:none; font-size:var(--s13); color:var(--body)}
.legend li{display:flex; align-items:center; gap:6px; white-space:nowrap}
.key{flex:0 0 auto; width:11px; height:11px; border-radius:50%; background:var(--ink)}
.key.lo{background:var(--paper); border:2.5px solid var(--brand)}
.key.up{background:var(--high-tint)}
.key.hi{background:var(--high); width:14px; height:14px}
.pinwrap:focus-visible .pin-dot,.pinwrap:focus-visible .pin-label{outline:2px solid var(--brand); outline-offset:2px}

.map .leaflet-popup-content-wrapper{border-radius:3px}
.map .leaflet-popup-content{margin:12px 14px; font-size:var(--s13); line-height:1.45; color:var(--body)}
.pop-name{display:block; font-size:var(--s15); font-weight:600; color:var(--ink)}
.pop-price{display:block; margin-top:4px; font-size:var(--s15); font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}
.pop-price.hi{color:var(--high)}
.pop-sub{display:block; color:var(--body); font-variant-numeric:tabular-nums}
.pop-date{display:block; color:var(--muted); font-variant-numeric:tabular-nums}
.pop-menu{display:inline-block; margin-top:6px; font-weight:500}
.pop-more{display:block; margin-top:8px; padding-top:8px; border-top:1px solid var(--rule); font-variant-numeric:tabular-nums}
.map .leaflet-popup-content a{color:var(--brand)}

/* on a phone a pin opens here, from the bottom of the screen, not over the map */
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--paper); border-top:2px solid var(--ink);
  padding:14px var(--pad) calc(18px + env(safe-area-inset-bottom, 0px));
  max-height:70vh; max-height:70svh; overflow-y:auto;
  font-size:var(--s15); line-height:1.45; color:var(--body);
  animation:sheetup .18s ease-out;
}
.sheet .pop-name{font-size:var(--s17); padding-right:64px}
.sheet .pop-price{font-size:var(--s21)}
.sheetclose{position:absolute; top:14px; right:var(--pad)}
@keyframes sheetup{from{transform:translateY(100%)} to{transform:none}}
@media (prefers-reduced-motion:reduce){ .sheet, .uploadbox{animation:none} }

/* ---------- find your shop ---------- */
.combo{position:relative}
.combo input{width:100%}
.combolist{
  position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:30;
  margin:0; padding:4px 0; list-style:none; max-height:264px; overflow-y:auto;
  background:var(--paper); border:1px solid var(--rule); border-radius:3px;
}
.combolist li{padding:8px 13px; cursor:pointer}
.combolist li[aria-selected=true],.combolist li:hover{background:rgba(27,94,74,.08)}
.optname{display:block; font-size:var(--s15); color:var(--ink); font-weight:500}
.optsub{display:block; font-size:var(--s13); color:var(--muted)}
.notfound{margin-top:10px}
.notfound .hint{margin:0}
.quick{margin-top:18px}
.quickrow{display:flex; gap:10px; flex-wrap:wrap; align-items:stretch}
.quickrow .moneywrap{flex:1 1 84px}
.quickrow select{flex:2 1 150px}
.swaplink{display:none; margin-top:10px}
.offers{margin-top:10px; font-size:var(--s15); display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline}
.firstgap{margin-top:14px; padding-top:14px; border-top:1px solid var(--rule); font-size:var(--s15)}
.morebtn{display:none; margin-top:10px}
.result{margin-top:20px}
.resultline{font-family:var(--f-display); font-weight:500; font-size:var(--s21); line-height:1.3; color:var(--ink)}
.resultline .linkbtn{font-family:var(--f-text)}

/* ---------- add your shop: send a menu ---------- */
.addshop{margin-top:10px}
.uploadlink{display:inline-block; margin-top:14px}
.uploadbox{position:relative; margin-top:20px; padding-top:16px; border-top:1px solid var(--rule)}
.uploadbox h3{font-size:var(--s21); padding-right:64px}
.uploadbox .sheetclose{top:16px; right:0}
.uploadbox .field-label{margin-top:14px}
.uploadbox input{display:block; width:100%; max-width:none}
.uploadbox input[type=file]{font-family:inherit; font-size:var(--s15); color:var(--body)}
.uploadbox .btn{margin-top:16px}
.uploadbox .formdone{margin-top:14px}

.signup{margin-top:30px; display:flex; gap:10px; flex-wrap:wrap}
input[type=email],input[type=number],input[type=text],select{
  font-family:inherit; font-size:var(--s15); color:var(--ink);
  background:var(--paper); border:1px solid var(--rule); border-radius:3px;
  padding:11px 13px; min-width:0;
}
input::placeholder{color:var(--muted)}
input[type=email]{flex:1 1 240px; max-width:420px}
.btn{
  background:var(--brand); color:#fff; font-weight:500; font-size:var(--s15);
  padding:12px 20px; border-radius:3px; border:1px solid var(--brand);
}
.btn:hover{filter:brightness(.92)}
.btn:disabled{opacity:.6; cursor:default; filter:none}
.fineprint{margin-top:12px; font-size:var(--s13); color:var(--muted)}
.formnote{margin-top:12px; font-size:var(--s15); color:var(--brand); font-weight:500}
.formnote.bad{color:var(--high)}
.formdone{font-size:var(--s17); color:var(--brand); font-weight:500; max-width:46ch}

/* ---------- rank finder ---------- */
.finder h2{font-size:var(--s21); margin-bottom:14px}
.field-label{display:block; font-size:var(--s15); color:var(--muted); margin-bottom:8px}
.choices{display:flex; flex-wrap:wrap; gap:8px 18px; margin:16px 0 22px}
.choice{
  font-size:var(--s15); color:var(--muted); padding:3px 0;
  border-bottom:2px solid transparent;
}
.choice:hover{color:var(--ink)}
.choice[aria-pressed=true]{color:var(--ink); font-weight:500; border-bottom-color:var(--brand)}

.moneyrow{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap}
.moneywrap{position:relative; flex:1 1 150px}
.moneywrap .dollar{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:var(--s15); pointer-events:none}
.moneywrap input{width:100%; padding-left:26px}

.verdict{margin-top:4px}
.strip{margin-top:20px}
.strip svg{display:block; width:100%; height:76px; overflow:visible}
.axis{display:flex; justify-content:space-between; font-size:var(--s13); color:var(--muted); margin-top:6px}
.hint{font-size:var(--s15); color:var(--muted); margin-top:14px}
.outliernote{font-size:var(--s13); color:var(--muted); margin-top:10px}
.consequence{margin-top:18px; font-size:var(--s15)}
.consequence p + p{margin-top:6px}

#reader-marker{transform-box:view-box; transform-origin:0 0; transition:transform .4s cubic-bezier(.22,.61,.36,1)}
@media (prefers-reduced-motion:reduce){ #reader-marker{transition:none} }

/* ---------- sections ---------- */
section.band{padding:var(--gap-section) 0}
.sec-head h2{font-size:var(--s33); letter-spacing:-.01em}
.sec-head p{margin-top:12px; font-size:var(--s17); max-width:62ch}
.sec-head{margin-bottom:30px}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; min-width:520px; font-size:var(--s15)}
caption{text-align:left; font-size:var(--s13); color:var(--muted); padding-bottom:10px}
th,td{text-align:left; padding:13px 16px 13px 0; border-bottom:1px solid var(--rule); vertical-align:top}
th{color:var(--muted); font-weight:500; font-size:var(--s13); white-space:nowrap; border-bottom-color:var(--ink)}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums}
tr > *:last-child{padding-right:0}
th.n .sortbtn{justify-content:flex-end; width:100%}
thead th{position:relative}
.sortbtn{display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:var(--s13); font-weight:500; padding:2px 0}
.sortbtn:hover{color:var(--ink)}
th[aria-sort] .sortbtn{color:var(--ink)}
.caret{font-size:10px; line-height:1}
tbody tr:last-child td{border-bottom:1px solid var(--rule)}
td.item{color:var(--ink); font-weight:500}
td.mid{color:var(--ink); font-weight:600}
td.soft{color:var(--muted)}
td.hi{color:var(--high); font-weight:600}
.tablefoot{margin-top:18px; display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.linkbtn{font-size:var(--s15); color:var(--brand); font-weight:500; text-decoration:underline; text-underline-offset:3px}
.count{font-size:var(--s13); color:var(--muted)}
.filterbar{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:22px}
.filterbar input[type=text]{flex:1 1 260px; max-width:360px}
/* three short columns fit a phone without the sideways scroll wider tables need */
#named-table{min-width:0}
.filterrow{display:flex; gap:8px 18px; flex-wrap:wrap; align-items:baseline; margin-bottom:14px}
.filterrow .lbl{font-size:var(--s13); color:var(--muted); min-width:52px}

/* ---------- charts ---------- */
.chart{margin-top:8px}
.chart svg{display:block; width:100%; overflow:visible}
.chartnote{margin-top:16px; font-size:var(--s13); color:var(--muted); max-width:60ch}

/* ---------- tab module ---------- */
.tabmodule{padding-top:56px}
.tabbar{position:sticky; top:0; z-index:20; background:var(--paper)}
.tabbar .wrap{position:relative}
.tabstrip{
  display:flex; gap:28px; align-items:flex-end;
  padding:4px 0 5px; border-bottom:1px solid var(--rule);
  overflow-x:auto; overflow-y:hidden;
  scrollbar-width:none; -ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
}
.tabstrip::-webkit-scrollbar{display:none}
.tabstrip [role=tab]{
  flex:0 0 auto; white-space:nowrap;
  font-family:var(--f-text); font-weight:500; font-size:16px; line-height:1.3;
  color:var(--muted); padding:10px 0 9px; border-bottom:2px solid transparent;
}
.tabstrip [role=tab]:hover{color:var(--ink)}
.tabstrip [role=tab][aria-selected=true]{color:var(--ink); border-bottom-color:var(--brand)}
/* the fade tells a narrow screen there are more tabs off to the right;
   it sits above the hairline and must never swallow a click */
.tabbar .wrap::after{
  content:""; position:absolute; top:0; right:var(--pad); bottom:6px; width:48px;
  background:linear-gradient(to right, rgba(255,255,255,0), var(--paper));
  pointer-events:none; opacity:0; transition:opacity .15s linear;
}
.tabbar.more-right .wrap::after{opacity:1}
@media (prefers-reduced-motion:reduce){ .tabbar .wrap::after{transition:none} }

section.tabpanel{padding-top:44px}
/* hidden="until-found" leaves the element in flow with a zero-height subtree,
   so its own padding would still show as a gap. display:none panels are
   unaffected by this. Never set display here or until-found stops working. */
section.tabpanel[hidden]{padding-top:0; padding-bottom:0}

.tolink{margin-top:16px}

/* ---------- waitlist ---------- */
.waitlist{background:rgba(27,94,74,.055); padding:var(--gap-section) 0}
.waitlist h2{font-size:var(--s33)}
.waitlist .intro{margin-top:14px; font-size:var(--s17); max-width:60ch}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:34px 48px; margin:40px 0}
.grid2 h3{font-size:var(--s17); font-family:var(--f-text); font-weight:600; color:var(--ink)}
.grid2 p{margin-top:6px; font-size:var(--s15); color:var(--body); max-width:42ch}
.price-line{font-family:var(--f-display); font-weight:500; font-size:var(--s26); color:var(--ink); margin-bottom:16px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--rule); padding:36px 0 44px}
.footgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px 40px}
.footline{margin-top:22px; font-size:var(--s13)}
footer h3{font-family:var(--f-text); font-size:var(--s13); font-weight:600; color:var(--ink); margin-bottom:4px}
footer .blk p{font-size:var(--s13); line-height:1.5}
.colophon{margin-top:28px; padding-top:16px; border-top:1px solid var(--rule); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; font-size:var(--s13); color:var(--muted)}

.loading{padding:80px 0; color:var(--muted)}
.dataerr{padding:26px; border:1px solid var(--high); border-radius:3px; color:var(--ink); margin:40px 0}
.dataerr code{font-family:ui-monospace,Menlo,monospace; font-size:14px; background:rgba(0,0,0,.05); padding:2px 5px; border-radius:2px}

@media (max-width:860px){
  :root{--gap-section:48px; --pad:20px}
  .tabmodule{padding-top:40px}
  section.tabpanel{padding-top:32px}
  /* phone order: headline, item picker, map, find your shop, result, then the signup */
  .hero{padding:24px 0 var(--gap-section)}
  .hero-layout{display:flex; flex-direction:column}
  .hero h1{order:1}
  .mapcol{order:3}
  .finder{order:4; margin-top:28px}
  /* the item picker is the only control above the map; the view switch moves
     into the map's corner */
  .mapbar{padding-top:14px}
  .itempick{flex:1 1 auto}
  .itempick select{flex:1 1 auto}
  .mapbar .viewbar{display:none}
  .viewswitch{display:block}
  /* one way in at a time: the shop search, or the price and area */
  .swaplink{display:inline-block}
  .finder .quick{display:none; margin-top:0}
  .finder.byprice .quick{display:block}
  .finder.byprice .shopfind, .finder.byprice .notfound{display:none}
  .deskonly{display:none}

<script>
"use strict";

const SUPABASE_URL = "https://ybcnzkzgyoghkqsxnqkl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliY256a3pneW9naGtxc3hucWtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODc0MzAsImV4cCI6MjEwNTQ2MzQzMH0.koP33NN4VcbzyBtfBoAT9Gbwd0ayU03-5tW6YZOZr4A";

const SB_HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json",
  "Prefer": "return=minimal"
};

/* One id per tab, held in memory only. No localStorage, no sessionStorage,
   so it does not survive a reload and nothing is written to the device. */
const SESSION_ID = Math.random().toString(36).slice(2) + "-" + Date.now().toString(36);

/* Analytics. Fire and forget: a failure here must never surface to the reader
   or interrupt anything on the page. */
function track(eventName, props){
  try{
    const payload = JSON.stringify({
      name: String(eventName),
      props: props || {},
      session_id: SESSION_ID
    });
    // fetch, never sendBeacon: a beacon always sends cookies, and Supabase
    // answers every site ("*"), a pair the browser refuses, so each beacon
    // was dropped before it left. keepalive lets the request outlive the page.
    fetch(SUPABASE_URL + "/rest/v1/events", {
      method: "POST", keepalive: true, credentials: "omit", headers: SB_HEADERS, body: payload
    }).catch(() => {});
  }catch(_){ /* swallowed on purpose */ }
}

/* Where the visit came from, read once as the page loads. src is the tag on
   our own links (?src=newsletter); anything that is not a short plain tag is
   dropped, so nothing personal can ride in on it. ref is the referring site's
   host name only, never its full address. The tag is then taken out of the
   address bar, hash kept, so a copied link does not carry it to someone else. */
const VISIT = (() => {
  let src = null, ref = null;
  try{
    const url = new URL(location.href);
    const tag = url.searchParams.get("src");
    if(tag !== null){
      if(/^[A-Za-z0-9_-]{1,40}$/.test(tag)) src = tag.toLowerCase();
      url.searchParams.delete("src");
      history.replaceState(history.state, "", url.pathname + url.search + url.hash);
    }
  }catch(_){ /* the page works the same without it */ }
  try{ if(document.referrer) ref = new URL(document.referrer).hostname || null; }catch(_){ ref = null; }
  const w = window.innerWidth;
  return {src: src, ref: ref,
          device: w < 768 ? "phone" : w <= 1100 ? "tablet" : "desktop",
          // lets the dashboard drop preview and localhost visits
          host: location.hostname};
})();

/* visit_end: how long the tab was actually in view, sent once, the first time
   the visitor leaves or hides it. Phones often never fire pagehide, so the
   tab being hidden counts as leaving too. */
let visibleSince = document.visibilityState === "visible" ? Date.now() : null;
let visibleMs = 0, visitEnded = false;
function endVisit(){
  if(visitEnded) return;
  visitEnded = true;
  if(visibleSince !== null) visibleMs += Date.now() - visibleSince;
  track("visit_end", {seconds_visible: Math.round(visibleMs / 1000)});
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden") endVisit();
  else if(visibleSince === null) visibleSince = Date.now();   // opened in a background tab
});
window.addEventListener("pagehide", endVisit);

/* time_on_page and scroll_depth */
const PAGE_OPENED = Date.now();
const DEPTHS_SEEN = new Set();
function watchScrollDepth(){
  const check = () => {
    const doc = document.documentElement;
    const full = doc.scrollHeight - window.innerHeight;
    const pct = full <= 0 ? 100 : ((window.scrollY / full) * 100);
    [25, 50, 75, 100].forEach(mark => {
      if(pct >= mark - 0.5 && !DEPTHS_SEEN.has(mark)){
        DEPTHS_SEEN.add(mark);
        track("scroll_depth", {percent: mark});
      }
    });
  };
  window.addEventListener("scroll", check, {passive: true});
  check();
}
window.addEventListener("pagehide", () => {
  track("time_on_page", {seconds: Math.round((Date.now() - PAGE_OPENED) / 1000)});
}, {once: true});

/* SVGs are drawn at native pixel scale so their labels never scale with a
   viewBox. Every chart redraws when its container changes width. */
function boxWidth(el, fallback){
  const w = el.getBoundingClientRect().width;
  return w > 40 ? Math.round(w) : fallback;
}
const REDRAWERS = [];
function onResize(fn){ REDRAWERS.push(fn); }
let rzTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => REDRAWERS.forEach(f => f()), 120);
});

const money = n => "$" + Number(n).toFixed(2);
const MONTH_NAMES = {"01":"January","02":"February","03":"March","04":"April","05":"May","06":"June",
                     "07":"July","08":"August","09":"September","10":"October","11":"November","12":"December"};
const monthLabel = m => (MONTH_NAMES[String(m).slice(5,7)] || m);
/* "2026-09-19" -> "19 Sep 2026", taken apart as text so no time zone can move it */
function shortDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  return m ? `${Number(m[3])} ${MONTH_NAMES[m[2]].slice(0, 3)} ${m[1]}` : "";
}
/* "2026-10-04" -> "4 Oct" */
const dayMonth = iso => shortDate(iso).replace(/ \d{4}$/, "");
/* "on 4 Oct 2026" when every price was checked the same day, otherwise
   "from 19 Sep 2026 to 4 Oct 2026" */
function checkedWhen(dates){
  const seen = dates.filter(Boolean).sort();
  if(!seen.length) return "";
  const first = seen[0], last = seen[seen.length - 1];
  return first === last ? `on ${shortDate(first)}` : `from ${shortDate(first)} to ${shortDate(last)}`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const median = arr => {
  const a=[...arr].sort((x,y)=>x-y), h=Math.floor(a.length/2);
  return a.length%2 ? a[h] : (a[h-1]+a[h])/2;
};

let DATA = null;

fetch("site_data.json", {cache:"no-store"})
  .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(d => { DATA = d; render(d); })
  .catch(err => {
    document.getElementById("app").className = "wrap";
    document.getElementById("app").innerHTML =
      '<div class="dataerr"><strong>site_data.json could not be loaded.</strong>' +
      '<p style="margin-top:10px">This page reads every figure from <code>site_data.json</code> at runtime, ' +
      'so it needs to be served over http rather than opened straight off disk. From this folder run ' +
      '<code>python3 -m http.server 8000</code> and open <code>http://localhost:8000/</code>.</p>' +
      '<p style="margin-top:10px;color:var(--muted);font-size:14px">' + esc(err.message) + '</p></div>';
  });

/* ======================== TOP LEVEL TABS ========================
   All three panels stay in the DOM whatever is showing, so every launch and
   offer stays indexable and findable. Inactive panels are hidden with
   hidden="until-found" where the browser supports it, which lets find-in-page
   open the tab it lands in, and with a plain hidden attribute where it does
   not. Nothing is rebuilt on a switch, so every filter, sort and expanded
   state simply survives. */
const TABS = ["what-things-cost","whats-launching","whos-discounting"];
const DEFAULT_TAB = TABS[0];
let activeTab = DEFAULT_TAB;

/* Links from before the redesign still land somewhere sensible. The named
   prices moved into the map's list view and the district chart is gone, so
   #who-charges-what opens the list and #by-district gets the default tab. */
const LIST_HASH = "who-charges-what";
/* #waitlist is a place on the page, not a tab. The page is drawn after the
   data arrives, so the browser's own jump to it finds nothing and it is done
   by hand. */
const WAIT_HASH = "waitlist";
function routeHash(){
  const slug = (location.hash || "").replace("#", "");
  return {tab: TABS.indexOf(slug) === -1 ? DEFAULT_TAB : slug, list: slug === LIST_HASH,
          wait: slug === WAIT_HASH};
}
function scrollToWaitlist(){
  const el = document.getElementById(WAIT_HASH);
  if(el) el.scrollIntoView({behavior: "auto", block: "start"});
}

const UNTIL_FOUND = "onbeforematch" in document.documentElement;
const tabBtn = slug => document.getElementById("tab-" + slug);
const tabPanel = slug => document.getElementById("panel-" + slug);

/* A chart drawn inside a hidden panel measures zero and renders broken, so
   each one is marked dirty while it is out of sight and redrawn the first
   time its tab is opened, not on every switch. */
const PANEL_CHARTS = {};
function registerPanelChart(slug, draw){ PANEL_CHARTS[slug] = {draw: draw, dirty: true}; }
function panelShown(slug){
  const c = PANEL_CHARTS[slug];
  if(c && c.dirty){ c.draw(); c.dirty = false; }
}

/* measured off rects, not offsetLeft: the buttons' offsetParent is the
   padded .wrap, so offsetLeft and scrollLeft are in different origins */
function scrollTabIntoView(btn){
  const strip = document.getElementById("tabstrip");
  if(!strip || !btn) return;
  const s = strip.getBoundingClientRect(), b = btn.getBoundingClientRect();
  if(b.left < s.left) strip.scrollLeft += b.left - s.left - 16;
  else if(b.right > s.right) strip.scrollLeft += b.right - s.right + 16;
}

function scrollToModule(smooth){
  const el = document.getElementById("data-tabs");
  if(!el) return;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({behavior: (smooth && !reduce) ? "smooth" : "auto", block: "start"});
}

function activateTab(slug, opts){
  opts = opts || {};
  if(TABS.indexOf(slug) === -1) slug = DEFAULT_TAB;
  const prev = activeTab;
  activeTab = slug;

  TABS.forEach(t => {
    const btn = tabBtn(t), panel = tabPanel(t), on = (t === slug);
    btn.setAttribute("aria-selected", String(on));
    btn.tabIndex = on ? 0 : -1;
    if(on) panel.removeAttribute("hidden");
    else panel.setAttribute("hidden", UNTIL_FOUND ? "until-found" : "");
  });

  scrollTabIntoView(tabBtn(slug));
  panelShown(slug);
  updateStripFade();

  if(prev !== slug){
    if(opts.push !== false) history.pushState({tab: slug}, "", "#" + slug);
    if(opts.track !== false) track("tab_changed", {tab: slug, from: prev});
  }
  if(opts.focus) tabBtn(slug).focus();
  if(opts.scroll) scrollToModule(opts.smooth);
}

function updateStripFade(){
  const strip = document.getElementById("tabstrip"), bar = document.getElementById("tabbar");
  if(!strip || !bar) return;
  bar.classList.toggle("more-right",
    strip.scrollWidth - strip.clientWidth - strip.scrollLeft > 2);
}

function buildTabs(){
  const strip = document.getElementById("tabstrip");

  TABS.forEach((slug, i) => {
    tabBtn(slug).addEventListener("click", () => activateTab(slug));
    /* find-in-page landing inside a hidden panel reveals it by itself, so the
       tab bar has to catch up rather than fight it */
    tabPanel(slug).addEventListener("beforematch", () => {
      activateTab(slug, {push: false});
    });
  });

  strip.addEventListener("keydown", e => {
    let next = null;
    const i = TABS.indexOf(activeTab);
    if(e.key === "ArrowRight") next = TABS[(i + 1) % TABS.length];
    else if(e.key === "ArrowLeft") next = TABS[(i - 1 + TABS.length) % TABS.length];
    else if(e.key === "Home") next = TABS[0];
    else if(e.key === "End") next = TABS[TABS.length - 1];
    if(!next) return;
    e.preventDefault();
    activateTab(next, {focus: true});
  });

  strip.addEventListener("scroll", updateStripFade, {passive: true});
  onResize(updateStripFade);

  window.addEventListener("popstate", () => {
    const to = routeHash();
    // the waitlist link leaves whichever tab is open as it is
    if(to.wait){ scrollToWaitlist(); return; }
    activateTab(to.tab, {push: false});
    if(to.list) setView("list", {track: false, scroll: true, smooth: false});
  });

  const deep = routeHash();
  if(deep.tab !== activeTab){
    activateTab(deep.tab, {push: false, track: false});
    scrollToModule(false);
  } else {
    history.replaceState({tab: activeTab}, "", location.href);
    panelShown(activeTab);
    updateStripFade();
    if(deep.list) setView("list", {track: false, scroll: true, smooth: false});
    if(deep.wait){
      // the web fonts move the page a little as they arrive, so land again after
      scrollToWaitlist();
      requestAnimationFrame(scrollToWaitlist);
      if(document.fonts && document.fonts.ready) document.fonts.ready.then(scrollToWaitlist);
    }
  }
}

/* ============================ RENDER ============================ */
function render(d){
  const app = document.getElementById("app");
  app.className = "";
  app.replaceWith(document.getElementById("page-tpl").content.cloneNode(true));

  buildHero(d);
  buildFinder(d);
  buildUpload();
  buildNamed(d);
  buildViewToggle();
  wirePins();
  buildMap(d);
  drawCaption(d);
  buildPriceTable(d);
  buildLaunches(d);
  buildPromos(d);
  buildFooter(d);
  wireForms();
  watchScrollDepth();

  registerPanelChart("whats-launching", () => redrawLaunchChart());
  buildTabs();

  onResize(() => {
    drawStrip(d);
    if(map && viewMode === "map") map.invalidateSize();
    // a hidden panel cannot be measured, so it waits its turn instead
    Object.keys(PANEL_CHARTS).forEach(slug => {
      if(slug === activeTab){ PANEL_CHARTS[slug].draw(); PANEL_CHARTS[slug].dirty = false; }
      else PANEL_CHARTS[slug].dirty = true;
    });
  });

  track("page_view", {generated_at: d.meta.generated_at, src: VISIT.src, ref: VISIT.ref,
                      device: VISIT.device, host: VISIT.host});
}

/* ---------- hero ---------- */
function buildHero(d){
  document.getElementById("hero-headline").textContent =
    `See what ${d.meta.shops_with_prices} cafes in Singapore charge.`;
}

/* ---------- the compared items, as the picker groups and names them ---------- */
const ITEM_GROUPS = [
  ["Coffee", [["flat_white","Flat white"], ["latte","Latte"], ["cappuccino","Cappuccino"],
              ["americano","Americano"], ["espresso","Espresso"]]],
  ["Matcha", [["matcha_latte","Matcha latte"]]],
  ["Bakes",  [["croissant_plain","Croissant"], ["croissant_filled","Filled croissant"],
              ["kouign_amann","Kouign-amann"]]]
];
const ITEM_NAMES = {};
ITEM_GROUPS.forEach(g => g[1].forEach(([k, name]) => { ITEM_NAMES[k] = name; }));
const itemName = k => ITEM_NAMES[k] || k;
const itemWords = k => itemName(k).toLowerCase();

/* ---------- the selected item and the reader ----------
   One item is selected at a time and the map, the list view, the strip, the
   caption and the result all follow it. */
let FINDER_ITEMS = Object.keys(ITEM_NAMES);   // narrowed to the items the data has
let finderItem = "croissant_plain";
/* who is asking: {shopId} once they pick their shop from the data, or
   {price, district} when they just type a price. district is "" when they
   leave the area out, and then only the count across every tracked cafe is given. */
let reader = null;
let readerPrice = null;      // the price the strip marks
let markerSettled = false;   // the slide plays once per result, not on resize
const MIN_NEIGHBOURS = 3;    // fewer other shops than this and a district is not ranked
const SHOPS = new Map();     // every shop with at least one counted price

const byId = id => document.getElementById(id);
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const isPhone = () => window.matchMedia("(max-width: 860px)").matches;
const priceRow = (d, key) => d.price_table.find(r => r.item_canonical === key) || {};

function indexShops(d){
  (d.shop_items || []).forEach(s => {
    SHOPS.set(s.shop_id, {shop_id: s.shop_id, shop_name: s.shop_name, district: s.district,
                          address: s.address || "", lat: s.lat, lng: s.lng,
                          price_count: s.price_count || 0,
                          // in the picker's order, so the first offers are the commonest
                          items: FINDER_ITEMS.filter(k => s.items.indexOf(k) !== -1)});
  });
}

let setItem = () => {};
let enterPrice = () => {};
function buildFinder(d){
  FINDER_ITEMS = FINDER_ITEMS.filter(k => (d.named_prices[k] || []).length);
  indexShops(d);
  if(FINDER_ITEMS.indexOf(finderItem) === -1) finderItem = FINDER_ITEMS[0];

  // the platform's own select, so a phone shows its own picker
  const pick = byId("item-select");
  ITEM_GROUPS.forEach(([heading, items]) => {
    const live = items.filter(([k]) => FINDER_ITEMS.indexOf(k) !== -1);
    if(!live.length) return;
    const group = document.createElement("optgroup");
    group.label = heading;
    live.forEach(([k, name]) => {
      const o = document.createElement("option");
      o.value = k; o.textContent = name;
      group.appendChild(o);
    });
    pick.appendChild(group);
  });
  pick.value = finderItem;
  pick.addEventListener("change", () => setItem(pick.value));

  setItem = k => {
    if(k === finderItem || FINDER_ITEMS.indexOf(k) === -1) return;
    finderItem = k; markerSettled = false;
    pick.value = k;
    // a typed price was for the previous item, so it does not carry across
    if(reader && !reader.shopId){ reader = null; byId("finder-price").value = ""; }
    closePin();
    drawPins(d);
    drawCaption(d);
    setNamedItem();
    updateItemWords(d);
    showResult(d);
    track("item_selected", {item: k});
    track("tab_changed", {section:"rank_finder", item:k});
  };

  const sel = byId("finder-district");
  d.meta.districts.forEach(name => {
    const o = document.createElement("option");
    o.value = name; o.textContent = name;
    sel.appendChild(o);
  });

  /* On a phone only one way in shows at a time. The class does nothing on a
     wide screen, where the shop search and the price row are both in view. */
  const panel = byId("finder");
  const byPrice = on => {
    panel.classList.toggle("byprice", on);
    byId(on ? "finder-price" : "shop-input").focus();
  };
  enterPrice = () => byPrice(true);
  byId("to-price").addEventListener("click", () => byPrice(true));
  byId("to-shop").addEventListener("click", () => byPrice(false));

  byId("finder-to-table").addEventListener("click", () => {
    track("rank_finder_to_table", {item: finderItem});
    setView("list", {scroll: true});
  });

  byId("finder-form").addEventListener("submit", e => {
    e.preventDefault();
    const v = parseFloat(byId("finder-price").value);
    if(!isFinite(v) || v <= 0){ byId("finder-price").focus(); return; }
    // the price path replaces whichever shop was found before
    byId("shop-input").value = "";
    byId("shop-notfound").hidden = true;
    reader = {price: v, district: sel.value};
    markerSettled = false;
    track("rank_finder_submitted", {item:finderItem});
    drawPins(d);
    showResult(d);
  });

  // the result offers other items when a shop has no price for this one
  byId("result-offers").addEventListener("click", e => {
    const b = e.target.closest("[data-item]");
    if(b) setItem(b.dataset.item);
  });
  byId("result-more").addEventListener("click", e => {
    byId("result-rest").classList.add("open");
    e.currentTarget.setAttribute("aria-expanded", "true");
    e.currentTarget.hidden = true;
  });

  buildShopSearch(d);
  updateItemWords(d);
  showResult(d);
}

/* the labels that name the selected item */
function updateItemWords(d){
  byId("finder-to-table").textContent =
    `See all ${d.named_prices[finderItem].length} cafes in a list`;
  byId("price-label").textContent = `Enter your ${itemWords(finderItem)} price`;
  byId("to-price").textContent = `Not listed? Enter your ${itemWords(finderItem)} price`;
}

/* ---------- find your shop ----------
   What is typed here never leaves the page. Analytics only learns whether a
   shop was found. */
function buildShopSearch(d){
  const input = byId("shop-input"), list = byId("shop-list"), nf = byId("shop-notfound");
  const all = [...SHOPS.values()].sort((a,b) => a.shop_name.localeCompare(b.shop_name));
  let matches = [], active = -1, missTimer = null, missSent = false;
  // "Velvete" finds "Velveté": accents are dropped from both sides
  const fold = t => String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  function close(){
    list.hidden = true; active = -1;
    input.setAttribute("aria-expanded", "false");
    input.removeAttribute("aria-activedescendant");
  }
  function setActive(i){
    active = i;
    list.querySelectorAll("li").forEach((li, n) => li.setAttribute("aria-selected", String(n === i)));
    if(i < 0){ input.removeAttribute("aria-activedescendant"); return; }
    const li = byId("shop-opt-" + i);
    input.setAttribute("aria-activedescendant", li.id);
    li.scrollIntoView({block: "nearest"});
  }
  function paint(){
    const q = fold(input.value.trim());
    clearTimeout(missTimer);
    const name = s => fold(s.shop_name);
    matches = q ? all.filter(s => name(s).startsWith(q))
                    .concat(all.filter(s => !name(s).startsWith(q) && name(s).includes(q))) : [];
    if(!matches.length){
      close();
      const miss = q.length >= 2;
      nf.hidden = !miss;
      if(!miss){ missSent = false; return; }
      // once per miss, and only after they stop typing
      if(!missSent) missTimer = setTimeout(() => { missSent = true; track("shop_search", {found: false}); }, 900);
      return;
    }
    nf.hidden = true; missSent = false;
    list.innerHTML = matches.map((s, i) =>
      `<li role="option" id="shop-opt-${i}" aria-selected="false" data-i="${i}">` +
      `<span class="optname">${esc(s.shop_name)}</span>` +
      `<span class="optsub">${esc([s.address, s.district].filter(Boolean).join(", "))}</span></li>`).join("");
    list.hidden = false; active = -1;
    input.setAttribute("aria-expanded", "true");
    input.removeAttribute("aria-activedescendant");
  }
  function choose(s){
    input.value = s.shop_name;
    close(); nf.hidden = true; missSent = false; clearTimeout(missTimer);
    byId("finder-price").value = "";
    byId("finder-district").value = "";
    reader = {shopId: s.shop_id};
    markerSettled = false;
    track("shop_search", {found: true});
    closePin();
    drawPins(d);
    findGaps(d, s);
    showResult(d);
    flyToShop(s);
  }

  // a close left over from a blur must not shut a list opened since
  let blurTimer = null;
  input.addEventListener("input", () => {
    clearTimeout(blurTimer);
    // editing the name lets go of whoever was found before
    if(reader){ reader = null; drawPins(d); showResult(d); }
    paint();
  });
  input.addEventListener("focus", () => { clearTimeout(blurTimer); if(!reader && input.value.trim()) paint(); });
  input.addEventListener("blur", () => { blurTimer = setTimeout(close, 120); });
  input.addEventListener("keydown", e => {
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      if(list.hidden){ paint(); if(list.hidden) return; }
      e.preventDefault();
      const n = matches.length;
      setActive(e.key === "ArrowDown" ? (active + 1) % n : (active - 1 + n) % n);
    } else if(e.key === "Enter"){
      if(!list.hidden && active >= 0){ e.preventDefault(); choose(matches[active]); }
      else if(!list.hidden && matches.length === 1){ e.preventDefault(); choose(matches[0]); }
      else if(!nf.hidden){ e.preventDefault(); enterPrice(); }
    } else if(e.key === "Escape"){
      close();
    }
  });
  // keep focus in the field while an option is being picked
  list.addEventListener("pointerdown", e => e.preventDefault());
  list.addEventListener("click", e => {
    const li = e.target.closest("li[data-i]");
    if(li) choose(matches[Number(li.dataset.i)]);
  });
}

function drawStrip(d){
  const rows = d.named_prices[finderItem];
  const main = rows.filter(r => !r.is_outlier);
  const outs = rows.filter(r => r.is_outlier).sort((a,b) => a.price - b.price);
  const prices = main.map(r => r.price);
  const lo = Math.min(...prices), hi = Math.max(...prices);
  const med = median(prices);

  const el = document.getElementById("strip-svg");
  const W = boxWidth(el.parentElement, 420);
  const H = 76, PADX = 12, base = 56, span = (hi - lo) || 1;
  const TICK_MAX = 28, MED_H = 36, READER_H = 40;
  // outliers sit in their own zone past a break line, so one distant shop
  // cannot squash the range everybody else actually trades in
  const ZONE = outs.length ? 46 : 0;
  const axisRight = W - PADX - ZONE;
  const x = p => PADX + ((p - lo) / span) * (axisRight - PADX);
  const outX = i => axisRight + 20 + (outs.length > 1 ? (i / (outs.length - 1)) * 18 : 9);

  const counts = new Map();
  prices.forEach(p => counts.set(p, (counts.get(p)||0) + 1));
  const maxCount = Math.max(...counts.values());

  let svg = "";
  counts.forEach((c, p) => {
    const h = 8 + (c / maxCount) * (TICK_MAX - 8);
    svg += `<rect x="${(x(p)-1).toFixed(2)}" y="${(base-h).toFixed(2)}" width="2" height="${h.toFixed(2)}" fill="var(--rule)"></rect>`;
  });
  svg += `<line x1="${PADX}" y1="${base}" x2="${axisRight}" y2="${base}" stroke="var(--rule)" stroke-width="1"></line>`;

  svg += `<rect x="${(x(med)-1).toFixed(2)}" y="${base-MED_H}" width="2" height="${MED_H}" fill="var(--ink)"></rect>`;
  const medLabelX = Math.min(Math.max(x(med), 52), axisRight - 40);
  svg += `<text x="${medLabelX.toFixed(2)}" y="${base+15}" fill="var(--muted)" font-family="Archivo,sans-serif" font-size="11" text-anchor="middle" style="font-variant-numeric:tabular-nums">usual price ${money(med)}</text>`;

  if(outs.length){
    svg += `<line x1="${axisRight + 10}" y1="${base - 30}" x2="${axisRight + 10}" y2="${base + 4}" stroke="var(--rule)" stroke-width="1"></line>`;
    outs.forEach((o, i) => {
      svg += `<rect x="${(outX(i)-1).toFixed(2)}" y="${base-16}" width="2" height="16" fill="var(--muted)"></rect>`;
    });
  }

  let targetX = null;
  if(readerPrice !== null){
    if(outs.length && readerPrice > hi){
      // beyond the main range: the reader belongs in the outlier zone
      targetX = outX(outs.length - 1) + (outs.length > 1 ? 0 : 0);
    } else {
      targetX = x(Math.min(Math.max(readerPrice, lo), hi));
    }
    svg += `<g id="reader-marker" transform="translate(0,0)">
      <rect x="-1.5" y="${base-READER_H}" width="3" height="${READER_H}" fill="var(--brand)"></rect>
      <text x="0" y="${base-READER_H-5}" fill="var(--brand)" font-family="Archivo,sans-serif" font-size="12" font-weight="600" text-anchor="middle" style="font-variant-numeric:tabular-nums">${money(readerPrice)}</text>
    </g>`;
  }

  el.setAttribute("viewBox", `0 0 ${W} ${H}`);
  el.setAttribute("preserveAspectRatio", "xMinYMin meet");
  el.innerHTML = svg;

  document.getElementById("axis-low").textContent = money(lo);
  document.getElementById("axis-high").textContent = money(hi);
  // the high label marks the end of the axis, not the end of the outlier zone
  document.querySelector(".axis").style.paddingRight = ZONE ? (ZONE - 4) + "px" : "0";

  const noteEl = document.getElementById("strip-outlier");
  if(outs.length === 1){
    noteEl.textContent = `1 shop charges ${money(outs[0].price)}, far from the rest. It is shown on the right.`;
  } else if(outs.length > 1){
    noteEl.textContent = `${outs.length} shops charge ${money(outs[0].price)} to ${money(outs[outs.length-1].price)}, far from the rest. They are shown on the right.`;
  } else {
    noteEl.textContent = "";
  }
  noteEl.hidden = outs.length === 0;

  document.getElementById("strip-desc").textContent =
    `${itemName(finderItem)} prices at ${main.length} cafes, from ${money(lo)} to ${money(hi)}. The usual price is ${money(med)}.` +
    (outs.length ? ` ${outs.length} more shop${outs.length>1?"s are":" is"} shown apart, with a very different price.` : "");

  if(targetX !== null){
    const marker = document.getElementById("reader-marker");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const slide = !reduce && !markerSettled;
    marker.style.transition = slide ? "" : "none";
    marker.style.transform = "translateX(0px)";
    void marker.getBoundingClientRect();
    marker.style.transform = "translateX(" + targetX.toFixed(2) + "px)";
    if(slide) markerSettled = true;
    if(!slide && !reduce) setTimeout(() => { marker.style.transition = ""; }, 0);
  }
}

/* ---------- the result ----------
   Two short sentences: how many of the cafes we track charge more, then where
   the reader stands in their own area. Shops on the same price share a place.
   Everything else waits behind "N more" on a phone. */
let gapLines = [];           // what the neighbours sell, for a found shop

function paintRest(lines){
  const first = byId("result-first"), more = byId("result-more"), rest = byId("result-rest");
  first.textContent = gapLines[0] || "";
  first.hidden = !gapLines.length;
  const all = lines.concat(gapLines.slice(1));
  rest.innerHTML = all.map(t => `<p>${esc(t)}</p>`).join("");
  rest.classList.remove("open");
  rest.hidden = !all.length;
  more.textContent = `${all.length} more`;
  more.setAttribute("aria-expanded", "false");
  more.hidden = !all.length;
}

function showResult(d){
  const rows = d.named_prices[finderItem];
  const box = byId("finder-result"), line = byId("result-line"), offers = byId("result-offers");
  readerPrice = null;
  offers.hidden = true;
  byId("result-upload").hidden = true;
  // the neighbour lines belong to a found shop and are worked out when one is picked
  if(!reader || !reader.shopId) gapLines = [];

  if(!reader){
    box.hidden = true;
    drawStrip(d);
    return;
  }
  box.hidden = false;

  let v, district, selfId = null;
  const rest = [];
  if(reader.shopId){
    const shop = SHOPS.get(reader.shopId);
    const own = rows.find(r => r.shop_id === reader.shopId);
    // a shop we know little about can send its menu
    byId("result-upload").hidden = !(shop.items.length === 0 || shop.price_count < MIN_PRICES);
    if(!own){
      line.textContent = `We have no ${itemWords(finderItem)} price for this shop yet.`;
      const have = shop.items.slice(0, 3);
      offers.innerHTML = have.length
        ? "<span>We have:</span>" + have.map(k =>
            `<button type="button" class="linkbtn" data-item="${esc(k)}">${esc(itemName(k))}</button>`).join("")
        : `<span>We have ${shop.price_count} other ${shop.price_count === 1 ? "price" : "prices"} from this shop, ` +
          `but none for the ${FINDER_ITEMS.length} items we compare.</span>`;
      offers.hidden = false;
      paintRest(rest);
      drawStrip(d);
      return;
    }
    v = own.price; district = own.district; selfId = own.shop_id;
    rest.push(`Our data has your price as ${money(v)}.`);
  } else {
    v = reader.price; district = reader.district;
  }

  const others = rows.filter(r => r.shop_id !== selfId);
  const above = others.filter(r => r.price > v).length;
  const near = others.filter(r => r.district === district);
  let local = null;

  // never more than the data: the count is out of the shops we have a price from
  let text = above === 0 ? "No cafe we track charges more than you."
           : `${above} of the ${rows.length} cafes we track ${above === 1 ? "charges" : "charge"} more than you.`;
  if(!district){
    // price only: no area, so no second sentence
  } else if(near.length < MIN_NEIGHBOURS){
    text += " " + (near.length === 0 ? `No other shop we track in ${district} sells this.`
                 : near.length === 1 ? `Only 1 other shop we track in ${district} sells this.`
                 : `Only ${near.length} other shops we track in ${district} sell this.`);
  } else {
    local = near.filter(r => r.price > v).length + 1;
    const same = near.filter(r => r.price === v).length;
    const below = near.filter(r => r.price < v).length;
    const place = local === 1 ? "the most expensive"
                : below === 0 ? "the cheapest"
                : `the ${ordinal(local)} most expensive of ${near.length + 1} shops`;
    text += ` In ${district}, you are ${place}` +
            (same ? ` (same as ${same} ${same === 1 ? "other" : "others"})` : "") + ".";
  }
  line.textContent = text;

  const med = median(rows.map(r => r.price));
  if(above){
    const top = rows.reduce((a, b) => (b.price > a.price ? b : a));
    rest.push(`The highest price is ${money(top.price)} at ${top.shop_name}.`);
  }
  rest.push(v > med ? `You charge more than the usual price of ${money(med)}.`
          : v === med ? `You charge the usual price, ${money(med)}.`
          : `The usual price is ${money(med)}. That is ${money(med - v)} more than yours.`);
  paintRest(rest);

  // ranks only: neither the price nor the shop goes anywhere
  track("rank_result", {item: finderItem, national_rank: above + 1, district_rank: local});
  track("rank_finder_result", {item: finderItem, rank: rows.filter(r => r.price < v).length + 1, of: rows.length});

  readerPrice = v;
  drawStrip(d);
}

/* ---------- add your shop: send a menu ----------
   The files go to a private bucket and one row records them. The key this page
   holds may only add: it cannot list, read, change or delete anything, so each
   file gets a name nobody else can have and the row is never read back. The
   shop name and the email go to that row and nowhere else. */
const MIN_PRICES = 5;        // a found shop with fewer counted prices is asked for its menu
const UPLOAD_BUCKET = "menu-uploads";
const UPLOAD_MAX_FILES = 3;
const UPLOAD_MAX_BYTES = 10 * 1024 * 1024;
const UPLOAD_TYPES = {jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp",
                      heic: "image/heic", heif: "image/heif", pdf: "application/pdf"};
const CONTACT_EMAIL = "arshin.sikka@u.nus.edu";
const fileExt = f => (/\.([a-z0-9]+)$/i.exec(f.name || "") || [])[1];
/* some phones give a HEIC photo no type, or a generic one, so the file name can stand in */
function uploadType(f){
  const known = Object.keys(UPLOAD_TYPES).map(k => UPLOAD_TYPES[k]);
  if(known.indexOf(f.type) !== -1) return f.type;
  if(f.type && f.type !== "application/octet-stream") return null;
  return UPLOAD_TYPES[String(fileExt(f) || "").toLowerCase()] || null;
}
function uploadName(f, type){
  const ext = Object.keys(UPLOAD_TYPES).find(k => UPLOAD_TYPES[k] === type);
  const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
           : Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  return `${Date.now()}-${id}.${ext}`;
}

let openUpload = () => {};
function buildUpload(){
  const box = byId("upload-box"), form = byId("upload-form");
  const shop = byId("up-shop"), email = byId("up-email"), files = byId("up-files");
  const note = byId("upload-note"), done = byId("upload-done");
  const btn = form.querySelector("button[type=submit]");
  const say = text => { note.className = "formnote bad"; note.textContent = text; note.hidden = false; };

  openUpload = name => {
    // after one menu is sent the form comes back empty for the next
    if(!done.hidden){ form.reset(); done.hidden = true; form.hidden = false; }
    note.hidden = true;
    shop.value = name || "";
    box.hidden = true; void box.offsetWidth; box.hidden = false;
    if(!isPhone()) (shop.value ? email : shop).focus();
    box.scrollIntoView({block: "nearest"});
  };
  const close = () => { box.hidden = true; };
  byId("upload-close").addEventListener("click", close);
  document.addEventListener("keydown", e => { if(e.key === "Escape") close(); });
  byId("add-shop").addEventListener("click", () => openUpload(byId("shop-input").value.trim()));
  // from under the map nobody has searched yet, so the name starts empty
  byId("map-add").addEventListener("click", () => openUpload(""));
  byId("result-upload").addEventListener("click", () => {
    const found = reader && reader.shopId && SHOPS.get(reader.shopId);
    openUpload(found ? found.shop_name : byId("shop-input").value.trim());
  });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    note.hidden = true;
    const picked = [...files.files];
    const types = picked.map(uploadType);
    const who = email.value.trim(), name = shop.value.trim();

    // nothing is sent until every part is right
    if(!name){ say("Please add your shop name."); shop.focus(); return; }
    if(!isEmail(who)){ say("Please check your email address."); email.focus(); return; }
    if(!picked.length){ say("Please add a photo of your menu."); files.focus(); return; }
    if(picked.length > UPLOAD_MAX_FILES){ say(`Please send ${UPLOAD_MAX_FILES} files or fewer.`); files.focus(); return; }
    if(types.some(t => !t)){ say("Please use a photo or a PDF."); files.focus(); return; }
    if(picked.some(f => f.size > UPLOAD_MAX_BYTES)){ say("This file is too big. Please use a photo under 10MB."); files.focus(); return; }

    btn.disabled = true;
    btn.textContent = "Sending...";
    try{
      const paths = [];
      for(let i = 0; i < picked.length; i++){
        const path = uploadName(picked[i], types[i]);
        const up = await fetch(`${SUPABASE_URL}/storage/v1/object/${UPLOAD_BUCKET}/${path}`, {
          method: "POST",
          headers: {"apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY,
                    "Content-Type": types[i], "x-upsert": "false"},
          body: picked[i]
        });
        if(!up.ok) throw new Error("upload HTTP " + up.status);
        paths.push(path);
      }
      const row = await fetch(SUPABASE_URL + "/rest/v1/menu_uploads", {
        method: "POST", headers: SB_HEADERS,
        body: JSON.stringify({shop_name: name, email: who, file_paths: paths})
      });
      if(!row.ok) throw new Error("row HTTP " + row.status);

      done.textContent = "Thank you. We will email your full ranking within a week.";
      form.hidden = true;
      done.hidden = false;
      // the count only: neither the shop nor the address
      track("menu_uploaded", {files: paths.length});
    }catch(err){
      // whatever they filled in stays in the form
      say(`We could not send that. Please try again, or email us at ${CONTACT_EMAIL}.`);
    }
    btn.disabled = false;
    btn.textContent = "Send";
  });
}

/* ---------- what your neighbours sell ----------
   Only for a shop found in the data, because only those have a recorded menu.
   An item is a gap when the shop has no recorded price for it, at least two
   other shops in its district do, and at least half of them do. */
const MAX_GAPS = 3;
function findGaps(d, shop){
  const menus = d.shop_items || [];
  const mine = menus.find(m => m.shop_id === shop.shop_id);
  const others = menus.filter(m => m.district === shop.district && m.shop_id !== shop.shop_id);
  if(!mine || others.length < MIN_NEIGHBOURS){ gapLines = []; return; }

  const gaps = d.price_table
    .filter(row => mine.items.indexOf(row.item_canonical) === -1)
    .map(row => ({key: row.item_canonical,
                  count: others.filter(m => m.items.indexOf(row.item_canonical) !== -1).length}))
    .filter(g => g.count >= 2 && g.count * 2 >= others.length)
    .sort((a, b) => b.count - a.count)        // stable, so ties keep the table's order
    .slice(0, MAX_GAPS);

  gapLines = gaps.length
    ? gaps.map(g => `${g.count} of the ${others.length} other shops we track in ${shop.district} sell ${itemWords(g.key)}. We didn't see it on your menu.`)
    : [`Of the ${d.price_table.length} items we compare, you already sell what most shops in ${shop.district} sell.`];
  track("neighbour_gaps_shown", {count: gaps.length});
}

function ordinal(n){
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/* ---------- map caption: the spread, per item ---------- */
function drawCaption(d){
  const rows = d.named_prices[finderItem];
  const clean = rows.filter(r => !r.is_outlier).map(r => r.price);
  const outs = rows.length - clean.length;
  const lo = Math.min(...clean), hi = Math.max(...clean);
  const gap = Math.round((hi / lo - 1) * 100);
  const checked = checkedWhen(rows.map(r => r.observed_date));
  byId("map-caption").textContent =
    `${itemName(finderItem)} costs ${money(lo)} to ${money(hi)} at ${rows.length} shops. ` +
    `The highest price is ${gap}% more than the lowest.` +
    (outs ? ` We left out ${outs} ${outs === 1 ? "shop" : "shops"} with a very different price.` : "") +
    (checked ? ` We checked these prices on each cafe's own menu ${checked}.` : "");
}

/* ---------- map ---------- */
let map = null, pinLayer = null;
let fitToItem = () => {};    // frames the selected item's pins
let awaitingFit = false;
let fenceMap = () => {};     // re-derives the zoom-out limit from the map's current size
let viewMode = "map";
const LABEL_ZOOM = 14;       // dots below this, price labels from here up
const FOUND_ZOOM = 16;

/* The basemap. This was meant to be CARTO Positron, but CARTO now answers every
   keyless request, on every endpoint, with an "API KEY REQUIRED" watermark tile.
   OneMap's Grey style is the closest keyless equivalent and only covers
   Singapore, hence the bounds. To go back to CARTO once there is a key:
     url "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?api_key=...",
     subdomains "abcd", maxZoom 20, no bounds, and the attribution
     (c) OpenStreetMap contributors (c) CARTO. */
const BASEMAP = {
  url: "https://www.onemap.gov.sg/maps/tiles/Grey/{z}/{x}/{y}.png",
  /* OneMap draws an inset box (Pedra Branca) and coordinate labels on its
     zoom 11 and 12 tiles only. Wider views are drawn from the zoom 13 tiles
     scaled down, so neither can appear at any zoom. */
  minNativeZoom: 13, maxZoom: 19,
  bounds: [[1.144, 103.585], [1.494, 104.122]],
  attribution: '<img src="https://www.onemap.gov.sg/web-assets/images/logo/om_logo.png" alt="" style="height:16px;width:16px;vertical-align:-3px"> ' +
               '<a href="https://www.onemap.gov.sg/" target="_blank" rel="noopener noreferrer">OneMap</a> &copy; contributors | ' +
               '<a href="https://www.sla.gov.sg/" target="_blank" rel="noopener noreferrer">Singapore Land Authority</a>'
};

let hintTimer = null;
function showMapHint(text){
  const el = byId("map-hint");
  el.textContent = text;
  el.classList.add("on");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => el.classList.remove("on"), 1400);
}

function buildMap(d){
  const el = byId("map");
  const unplaced = new Set();
  const placed = [];
  FINDER_ITEMS.forEach(k => (d.named_prices[k] || []).forEach(r => {
    if(r.lat == null || r.lng == null) unplaced.add(r.shop_id);
    else placed.push([r.lat, r.lng]);
  }));

  if(!window.L || !placed.length){
    // no map library or nothing to place: the list still has every price
    byId("view-toggle").hidden = true;
    byId("view-switch").hidden = true;
    setView("list", {track: false});
    return;
  }

  const touchFirst = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  map = L.map(el, {dragging: !touchFirst, zoomSnap: 0.5, maxZoom: BASEMAP.maxZoom, maxBoundsViscosity: 1});
  map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  L.tileLayer(BASEMAP.url, {
    minNativeZoom: BASEMAP.minNativeZoom, maxZoom: BASEMAP.maxZoom, bounds: BASEMAP.bounds,
    // flying to a shop passes through zoom levels nobody looks at. Without
    // this, tiles for each are requested and then abandoned mid-flight.
    updateWhenZooming: false, updateWhenIdle: true, keepBuffer: 1,
    attribution: BASEMAP.attribution
  }).addTo(map);

  /* The map opens fitted to the selected item's pins. It cannot be zoomed out
     past the view that holds every item's pins, or dragged far from them. */
  const everyPin = L.latLngBounds(placed);
  const EDGE = 16;             // pixels kept clear between the outermost pin and the map edge
  fenceMap = () => {
    map.setMinZoom(map.getBoundsZoom(everyPin, false, L.point(EDGE * 2, EDGE * 2)));
    map.setMaxBounds(everyPin.pad(0.5));
  };
  fenceMap();
  onResize(() => { if(viewMode === "map"){ map.invalidateSize(); fenceMap(); } });
  fitToItem = () => {
    const pts = d.named_prices[finderItem].filter(r => r.lat != null && r.lng != null).map(r => [r.lat, r.lng]);
    map.fitBounds(L.latLngBounds(pts.length ? pts : placed), {padding: [EDGE, EDGE], animate: false});
  };
  // an old #who-charges-what link opens on the list, where the map has no size
  // to fit against yet. It is fitted the first time it is shown instead.
  awaitingFit = el.offsetWidth === 0;
  if(!awaitingFit) fitToItem();

  const syncLabels = () => el.classList.toggle("labels", map.getZoom() >= LABEL_ZOOM);
  map.on("zoom zoomend", syncLabels);
  syncLabels();

  /* One finger scrolls the page and two move the map. A finger never drags the
     map, a mouse always can, and the pinch handler pans as well as zooms. */
  el.addEventListener("pointerdown", e => {
    if(e.pointerType === "touch") map.dragging.disable();
    else map.dragging.enable();
  }, true);
  let touchFrom = null;
  el.addEventListener("touchstart", e => {
    touchFrom = e.touches.length === 1 ? {x: e.touches[0].clientX, y: e.touches[0].clientY} : null;
  }, {passive: true});
  el.addEventListener("touchmove", e => {
    if(e.touches.length !== 1 || !touchFrom) return;
    const t = e.touches[0];
    if(Math.hypot(t.clientX - touchFrom.x, t.clientY - touchFrom.y) > 12) showMapHint("Use two fingers to move the map");
  }, {passive: true});

  /* The wheel scrolls the page unless Ctrl or Cmd is held. Stopping the event
     here keeps it from Leaflet without cancelling the page scroll. */
  const zoomKey = /Mac|iPhone|iPad/.test(navigator.platform || "") ? "⌘" : "Ctrl";
  el.addEventListener("wheel", e => {
    if(e.ctrlKey || e.metaKey) return;
    e.stopImmediatePropagation();
    showMapHint(`Hold ${zoomKey} and scroll to zoom the map`);
  }, {capture: true, passive: true});

  pinLayer = L.layerGroup().addTo(map);
  drawPins(d);
  // a tap on the map itself puts the phone's sheet away
  map.on("click", closePin);

  if(unplaced.size){
    const note = byId("map-note");
    note.textContent = `${unplaced.size} ${unplaced.size === 1 ? "cafe is" : "cafes are"} not on the map because we could not find the address. Every cafe is in the list.`;
    note.hidden = false;
  }
}

/* Where a price sits against the item's usual price (its median): the bottom
   quarter, the middle half, the top quarter, and more than 40% above the
   median, which is the same line the price table draws. Menu prices are round
   numbers, so many shops share one. A price counts as cheaper only when it is
   below the first quartile and as more expensive only when it is above the
   third, so a price that a large share of shops charge is always "normal". */
const BANDS = {lo: "Cheaper than most", mid: "About normal",
               up: "More expensive than most", hi: "Much more expensive"};
function bandOf(d){
  const prices = d.named_prices[finderItem].map(r => r.price).sort((a, b) => a - b);
  const at = q => {
    const pos = (prices.length - 1) * q, i = Math.floor(pos);
    return i + 1 < prices.length ? prices[i] + (pos - i) * (prices[i + 1] - prices[i]) : prices[i];
  };
  const med = priceRow(d, finderItem).median, q1 = at(0.25), q3 = at(0.75);
  return p => p > med * 1.4 ? "hi" : p > q3 ? "up" : p < q1 ? "lo" : "mid";
}

/* "service charge 10%" -> "10% service charge". GST is named without its rate. */
function chargeWords(c){
  if(/^gst\b/i.test(c)) return "GST";
  const m = /^(.*?)\s+(\d+(?:\.\d+)?%)$/.exec(c);
  return m ? `${m[2]} ${m[1]}` : c;
}

/* A pin's details, at most five lines: name, price (and the menu's own price
   where charges were added), date, the menu link, and how many more prices
   the shop has. */
function pinHtml(r, band){
  const more = r.more_prices || 0;
  const url = /^https?:\/\//.test(r.source_url || "") ? r.source_url : "";
  const when = shortDate(r.observed_date);
  const id = esc(r.shop_id);
  return `<span class="pop-name">${esc(r.shop_name)}</span>` +
    `<span class="pop-price${band === "hi" ? " hi" : ""}">${money(r.price)}</span>` +
    (r.listed_price != null && (r.charges || []).length
      ? `<span class="pop-sub">Menu price ${money(r.listed_price)} + ${esc(r.charges.map(chargeWords).join(" + "))}</span>` : "") +
    (when ? `<span class="pop-date">Checked ${when}</span>` : "") +
    (url ? `<a class="pop-menu" href="${esc(url)}" target="_blank" rel="noopener noreferrer" data-menu="${id}">See their menu</a>` : "") +
    (more > 0 ? `<span class="pop-more">${more} more ${more === 1 ? "price" : "prices"} from this shop. ` +
                `<a href="#${WAIT_HASH}" data-teaser="${id}">Join the waitlist</a> to see them.</span>` : "");
}

function openPin(r, band){
  const html = pinHtml(r, band);
  if(isPhone()){
    map.closePopup();
    byId("sheet-body").innerHTML = html;
    const sheet = byId("pin-sheet");
    // shown again from hidden, so the slide up replays
    sheet.hidden = true; void sheet.offsetWidth; sheet.hidden = false;
  } else {
    L.popup({offset: [0, -8], maxWidth: 260}).setLatLng([r.lat, r.lng]).setContent(html).openOn(map);
  }
  track("pin_opened", {shop_id: r.shop_id, item: finderItem});
}
function closePin(){
  const sheet = byId("pin-sheet");
  if(sheet) sheet.hidden = true;
  if(map) map.closePopup();
}
function wirePins(){
  byId("sheet-close").addEventListener("click", closePin);
  document.addEventListener("keydown", e => { if(e.key === "Escape") closePin(); });
  // the popup and the sheet are redrawn for every pin, so their links are caught here
  document.addEventListener("click", e => {
    const menu = e.target.closest("[data-menu]"), teaser = e.target.closest("[data-teaser]");
    if(menu) track("menu_link_clicked", {shop_id: menu.dataset.menu});
    if(teaser){ track("teaser_clicked", {shop_id: teaser.dataset.teaser}); closePin(); }
  });
}

function drawPins(d){
  if(!map) return;
  pinLayer.clearLayers();
  const rows = d.named_prices[finderItem].filter(r => r.lat != null && r.lng != null);
  const band = bandOf(d);
  const mine = reader && reader.shopId;

  // shops sharing a building share a coordinate, so their pins are fanned out
  // on screen. The coordinate itself is never moved.
  const spots = new Map();
  rows.forEach(r => {
    const key = r.lat + "," + r.lng;
    if(!spots.has(key)) spots.set(key, []);
    spots.get(key).push(r);
  });

  spots.forEach(group => group.forEach((r, i) => {
    const me = r.shop_id === mine;
    const b = band(r.price);
    const off = i - (group.length - 1) / 2;
    const marker = L.marker([r.lat, r.lng], {
      icon: L.divIcon({
        className: "pinwrap", iconSize: [0, 0],
        html: `<span class="pin ${b}${me ? " me" : ""}" style="--off:${off}">` +
              `<span class="pin-dot"></span><span class="pin-label">${money(r.price)}</span></span>`
      }),
      // the words carry what the colour says, for anyone who cannot see it
      title: `${r.shop_name}, ${money(r.price)}, ${BANDS[b].toLowerCase()}`,
      // a high price is never hidden under a neighbour
      zIndexOffset: me ? 1000 : b === "hi" ? 500 : b === "up" ? 250 : 0,
      riseOnHover: true
    });
    marker.on("click", () => openPin(r, b));
    marker.addTo(pinLayer);
  }));

  // the legend names only the kinds of pin this item has on the map
  const shown = new Set(rows.map(r => band(r.price)));
  document.querySelectorAll(".legend [data-band]").forEach(li => { li.hidden = !shown.has(li.dataset.band); });
}

function flyToShop(shop){
  if(!map || viewMode !== "map" || shop.lat == null || shop.lng == null) return;
  const zoom = Math.max(map.getZoom(), FOUND_ZOOM);
  if(reduceMotion()) map.setView([shop.lat, shop.lng], zoom, {animate: false});
  else map.flyTo([shop.lat, shop.lng], zoom, {duration: 0.9});
}

/* ---------- map or list ----------
   Both stay in the DOM. The list keeps its sort, filter and expanded state
   because nothing is rebuilt on a switch, and find-in-page can still reach a
   shop name while the map is showing. */
function setView(mode, opts){
  opts = opts || {};
  const changed = mode !== viewMode;
  viewMode = mode;
  const mapEl = byId("map-view"), listEl = byId("list-view");
  mapEl.hidden = mode !== "map";
  if(mode === "list") listEl.removeAttribute("hidden");
  else listEl.setAttribute("hidden", UNTIL_FOUND ? "until-found" : "");
  byId("view-toggle").querySelectorAll(".choice").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.view === mode)));
  // the phone's one button names the view it leads to
  byId("view-switch").textContent = mode === "map" ? "List" : "Map";
  byId("view-wrap").classList.toggle("listmode", mode === "list");
  closePin();

  if(mode === "map" && map){
    map.invalidateSize();
    fenceMap();
    if(awaitingFit){ awaitingFit = false; fitToItem(); }
    // catch up with a shop that was found while the list was showing
    const shop = reader && reader.shopId && SHOPS.get(reader.shopId);
    if(shop && shop.lat != null && shop.lng != null){
      map.setView([shop.lat, shop.lng], Math.max(map.getZoom(), FOUND_ZOOM), {animate: false});
    }
  }
  if(changed && opts.track !== false) track("list_view_toggled", {view: mode});
  if(opts.scroll){
    byId("map-col").scrollIntoView({behavior: (opts.smooth === false || reduceMotion()) ? "auto" : "smooth", block: "start"});
  }
}

function buildViewToggle(){
  byId("view-toggle").querySelectorAll(".choice").forEach(b =>
    b.addEventListener("click", () => setView(b.dataset.view)));
  byId("view-switch").addEventListener("click", () => setView(viewMode === "map" ? "list" : "map"));
  byId("list-view").addEventListener("beforematch", () => setView("list", {track: false}));
}

/* ---------- generic sortable table ---------- */
function makeSortable(tableId, getRows, renderRow, initial){
  const table = document.getElementById(tableId);
  const tbody = table.querySelector("tbody");
  let sortKey = initial.key, sortDir = initial.dir;

  function paint(){
    const rows = getRows();
    rows.sort((a,b) => {
      const av = a[sortKey], bv = b[sortKey];
      let c;
      if(typeof av === "number" && typeof bv === "number") c = av - bv;
      else if(av == null) c = 1;
      else if(bv == null) c = -1;
      else c = String(av).localeCompare(String(bv));
      return sortDir === "asc" ? c : -c;
    });
    tbody.innerHTML = rows.map(renderRow).join("");
    table.querySelectorAll("th").forEach(th => {
      const caret = th.querySelector(".caret");
      if(th.dataset.key === sortKey){
        th.setAttribute("aria-sort", sortDir === "asc" ? "ascending" : "descending");
        if(caret) caret.textContent = sortDir === "asc" ? "▲" : "▼";
      } else {
        th.removeAttribute("aria-sort");
        if(caret) caret.textContent = "";
      }
    });
  }

  table.querySelectorAll("th[data-key]").forEach(th => {
    const btn = th.querySelector(".sortbtn");
    btn.addEventListener("click", () => {
      const k = th.dataset.key;
      if(k === sortKey) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortKey = k; sortDir = "asc"; }
      paint();
      track("table_sorted", {table:tableId, key:k, dir:sortDir});
    });
  });

  paint();
  return paint;
}

/* ---------- price table ---------- */

        <td class="n soft">${r.shop_count}</td>
        <td class="n soft">${money(r.low)}</td>
        <td class="n mid">${money(r.median)}</td>
        <td class="n ${flagged ? "hi" : "soft"}">${money(r.high)}</td>
      </tr>`;
    },
    {key:"shop_count", dir:"desc"});
}
